name: Packages
# Slow, as it builds the toolchain's package too, so only when packaging can have changed.
on:
  workflow_dispatch:
  push:
    tags: ['*']
  pull_request:
    paths: ['packaging/**', 'Package.swift', 'contrib/**', 'data/**', 'po/**', '.github/workflows/packages.yml']
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - run: packaging/aur/test-install.sh
