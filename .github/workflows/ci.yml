name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-noble
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends pkg-config libglib2.0-dev libgtk-4-dev libgtk-4-bin
      - uses: actions/checkout@v4
      - run: swift --version
      - run: gtk4-builder-tool validate Sources/SpaceStateSettings/settings.ui
      - run: swift build -c release --static-swift-stdlib
      - run: swift test
